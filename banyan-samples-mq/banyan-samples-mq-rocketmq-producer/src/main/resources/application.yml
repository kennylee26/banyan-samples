server:
  port: ${SERVER_PORT:0}

spring:
  datasource:
    url: jdbc:h2:mem:banyan-mq;DB_CLOSE_DELAY=-1
    username: sa
    password:

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: banyan-sample-rocketmq-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# banyan-mq：单后端项目也建议显式声明实例
# 完整默认值与注释见 banyan-mq 模块的 banyan-mq.yml
banyan:
  mq:
    enabled: true                    # 总开关，默认 true
    producer:
      enabled: true                  # 生产者模块开关，默认 true
      tag-suffix-enabled: true       # 给 tag 追加环境后缀，默认 true
    rocketmq:
      enabled: true                  # RocketMQ 后端开关，默认 true
    instances:
      rocketmq:
        type: rocketmq               # 逻辑实例名 → 后端类型
