server:
  port: ${SERVER_PORT:0}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

# banyan-mq：单后端项目也建议显式声明，便于阅读和后续扩展
# 完整默认值与注释见 banyan-mq 模块的 banyan-mq.yml
banyan:
  mq:
    enabled: true                    # 总开关，默认 true
    producer:
      enabled: true                  # 生产者模块开关，默认 true
      tag-suffix-enabled: true       # 给 tag 追加环境后缀，默认 true
    kafka:
      enabled: true                  # Kafka 后端开关，默认 true
    instances:
      kafka:
        type: kafka                  # 逻辑实例名 → 后端类型
