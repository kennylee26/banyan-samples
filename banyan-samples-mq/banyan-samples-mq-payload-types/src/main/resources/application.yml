server:
  port: ${SERVER_PORT:0}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: banyan-sample-payload

banyan:
  mq:
    enabled: true                    # 总开关，默认 true
    producer:
      enabled: true                  # 生产者模块开关，默认 true
      tag-suffix-enabled: true       # 给 tag 追加环境后缀，默认 true
    consumer:
      enabled: true                  # 消费者模块开关，默认 true
      suffix-enabled: false          # 不给消费组与 tag 追加环境后缀，默认 true
    rocketmq:
      enabled: true                  # RocketMQ 后端开关，默认 true
    instances:
      rocketmq:
        type: rocketmq               # 逻辑实例名 → 后端类型
