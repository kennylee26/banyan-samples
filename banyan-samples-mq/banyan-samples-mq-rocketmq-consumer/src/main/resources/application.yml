server:
  port: ${SERVER_PORT:0}

# @MqConsumer 注解属性引用这些占位符，演示配置与代码解耦
samples:
  mq:
    instance: rocketmq
    topic: banyan-sample-rocketmq-consumer
    tag: paid
    group: banyan-sample-rocketmq-consumer

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: banyan-sample-rocketmq-consumer
  consumer:
    group: banyan-sample-rocketmq-consumer
    topic: banyan-sample-rocketmq-consumer
    consume-thread-max: 20
    consume-thread-min: 5

# banyan-mq：消费者组的实际值由注解上的 group 或自动生成，suffix 关闭以复用固定组名
banyan:
  mq:
    enabled: true                    # 总开关，默认 true
    consumer:
      enabled: true                  # 消费者模块开关，默认 true
      suffix-enabled: false          # 固定消费组名，不追加环境后缀，默认 true
    rocketmq:
      enabled: true                  # RocketMQ 后端开关，默认 true
    instances:
      rocketmq:
        type: rocketmq               # 逻辑实例名 → 后端类型
